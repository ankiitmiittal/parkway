<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Parkway">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a86ff"/>
      <stop offset="1" stop-color="#1c46c9"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed so the icon also works as a maskable/adaptive icon. -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- A route threading between three stops: the app in one glyph. -->
  <path d="M128 392 C 128 300 232 322 244 246 C 256 170 320 190 372 138"
        fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"
        stroke-dasharray="2 30" opacity="0.9"/>

  <circle cx="128" cy="392" r="26" fill="#ffffff" opacity="0.92"/>
  <circle cx="244" cy="246" r="32" fill="#ffffff"/>
  <circle cx="244" cy="246" r="13" fill="#1c46c9"/>
  <circle cx="378" cy="132" r="26" fill="#ffffff" opacity="0.92"/>
</svg>
